spring.application.name=siletry

# Railway injects PORT; locally defaults to 8080
server.port=${PORT:8080}

# ---------- Database ----------
# Railway's Postgres plugin exposes PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD.
# Reference them from your service's Variables tab (e.g. PGHOST=${{Postgres.PGHOST}}).
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:siletry}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Hibernate creates/updates tables itself. Switch to Flyway before real clinic data goes in.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.show-sql=false

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

# ---------- Siletry ----------
# Long random string in production (at least 32 characters)
siletry.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-only-secret-at-least-32-chars}
siletry.jwt.expiry-hours=${JWT_EXPIRY_HOURS:72}

# Comma-separated list of frontend origins
siletry.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# mock = log messages + dev panel. gupshup = real (adapter still to be written)
siletry.whatsapp.provider=${WHATSAPP_PROVIDER:mock}
# Central Siletry number doctors/receptionists talk to
siletry.whatsapp.admin-number=${WHATSAPP_ADMIN_NUMBER:919999999999}
# Shared secret the webhook caller must send in the X-Siletry-Webhook-Secret header
siletry.whatsapp.webhook-secret=${WHATSAPP_WEBHOOK_SECRET:dev-webhook-secret}

# Creates "Nandini Clinic" with demo data on first boot if the DB is empty
siletry.seed-demo=${SEED_DEMO:true}

# Default monthly cap of business-initiated (template) messages per clinic
siletry.default-message-cap=${DEFAULT_MESSAGE_CAP:1500}

# ---------- Ops: demo leads from siletry.com and alerts to the team ----------
# Long random string (at least 24 characters) for the /api/ops endpoints. Empty = ops API disabled.
siletry.ops.api-key=${OPS_API_KEY:}
# Meta WhatsApp Cloud API number that sends lead alerts. Works even while WHATSAPP_PROVIDER=mock.
siletry.ops.whatsapp.phone-number-id=${OPS_WA_PHONE_NUMBER_ID:}
siletry.ops.whatsapp.access-token=${OPS_WA_ACCESS_TOKEN:}
siletry.ops.whatsapp.api-version=${OPS_WA_API_VERSION:v21.0}
# Who gets the alerts: digits with country code, comma-separated for more than one person
siletry.ops.whatsapp.notify-to=${OPS_WA_NOTIFY_TO:}
# Empty = plain text (recipient must have messaged the business number in the last 24 hours).
# Set to an approved template name (e.g. new_demo_lead) to deliver any time.
siletry.ops.whatsapp.lead-template=${OPS_WA_LEAD_TEMPLATE:}
siletry.ops.whatsapp.lead-template-language=${OPS_WA_LEAD_TEMPLATE_LANG:en}
# Salt for hashing visitor IPs (raw IPs are never stored)
siletry.ops.leads.ip-hash-salt=${LEADS_IP_SALT:change-me-in-production}
siletry.ops.leads.rate-limit-max=${LEADS_RATE_LIMIT_MAX:5}
siletry.ops.leads.rate-limit-window=${LEADS_RATE_LIMIT_WINDOW:10m}
siletry.ops.leads.duplicate-window=${LEADS_DUPLICATE_WINDOW:24h}
siletry.ops.leads.max-notify-attempts=${LEADS_MAX_NOTIFY_ATTEMPTS:6}
siletry.ops.leads.retry-base-delay=${LEADS_RETRY_BASE_DELAY:1m}

management.endpoints.web.exposure.include=health
