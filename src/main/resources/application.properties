spring.application.name=siletry

# Railway injects PORT; locally defaults to 8080
server.port=${PORT:8080}

# ---------- Database ----------
# Railway's Postgres plugin exposes PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD.
# Reference them from your service's Variables tab (e.g. PGHOST=${{Postgres.PGHOST}}).
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:siletry}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Hibernate creates/updates tables itself. Switch to Flyway before real clinic data goes in.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.show-sql=false

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kolkata

# ---------- Siletry ----------
# Long random string in production (at least 32 characters)
siletry.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-only-secret-at-least-32-chars}
siletry.jwt.expiry-hours=${JWT_EXPIRY_HOURS:72}

# Comma-separated list of frontend origins
siletry.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# mock = log messages + dev panel. gupshup = real (adapter still to be written)
siletry.whatsapp.provider=${WHATSAPP_PROVIDER:mock}
# Central Siletry number doctors/receptionists talk to
siletry.whatsapp.admin-number=${WHATSAPP_ADMIN_NUMBER:919999999999}
# Shared secret the webhook caller must send in the X-Siletry-Webhook-Secret header
siletry.whatsapp.webhook-secret=${WHATSAPP_WEBHOOK_SECRET:dev-webhook-secret}

# Creates "Nandini Clinic" with demo data on first boot if the DB is empty
siletry.seed-demo=${SEED_DEMO:true}

# Default monthly cap of business-initiated (template) messages per clinic
siletry.default-message-cap=${DEFAULT_MESSAGE_CAP:1500}

management.endpoints.web.exposure.include=health
